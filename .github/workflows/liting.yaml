name: Linting

on: pull_request

jobs: 
  prettier: 
    name: Prettier
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run lint prettier
        run: npm run lint:prettier:check
